<style>
/* Layout: one phone-width column; sticker-style cards with ink outlines and hard offset shadows; the capsule machine is the hero. */

.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; margin-left: -5px; background: var(--paper); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }

.badge.a { background: var(--a); color: var(--a-ink); } .badge.b { background: var(--b); color: var(--b-ink); }
.char { width: 100%; max-width: 104px; height: auto; display: block; overflow: visible; }
.char .body { transform-box: fill-box; transform-origin: 50% 90%; }
.char.sleepy .body { transform: rotate(6deg) translateY(2px); }
.char.pout .body { transform: rotate(-3deg); }

.machine.shaking .dome { animation: shake 1.2s ease-in-out; }

@keyframes shake { 0%,100% { transform: rotate(0) } 15% { transform: rotate(-4deg) } 30% { transform: rotate(4deg) } 45% { transform: rotate(-3deg) } 60% { transform: rotate(3deg) } 75% { transform: rotate(-2deg) } 90% { transform: rotate(1deg) } }
@keyframes jiggle { 0%,100% { transform: translateY(0) } 20% { transform: translateY(-6px) } 40% { transform: translateY(2px) } 60% { transform: translateY(-5px) } 80% { transform: translateY(1px) } }
@keyframes spin { from { transform: rotate(0) } to { transform: rotate(360deg) } }
@keyframes drop { 0% { opacity: 1; transform: translateY(-40px) } 70% { opacity: 1; transform: translateY(0) } 85% { transform: translateY(-5px) } 100% { opacity: 1; transform: translateY(0) } }
.machine-label { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

.capsule-card { display: flex; align-items: center; gap: 10px; }

.score-row { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); background: var(--paper); border-top: 2px solid var(--line); }

.code { font-size: 22px; font-weight: 700; letter-spacing: 3px; font-variant-numeric: tabular-nums; }

  // ---------- storage ----------
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
  function loadLocal() { try { const s = lsGet(LOCAL_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function roleKey() { return ROLE_KEY + (store.code || 'local'); }
  // Apply fn to the latest state atomically. fn(s) mutates s (s may be null) and returns {write, state, ...}.
  async function mutate(fn) {
    if (store.mode === 'fb') {
      return store.db.runTransaction(async (tx) => {
        const snap = await tx.get(store.ref);
        const s = snap.exists ? clone(snap.data()) : null;
        const r = fn(s);
        if (r && r.write) { r.state.updatedAt = Date.now(); tx.set(store.ref, r.state); }
        return r;
      });
    }
    const r = fn(state);
    if (r && r.write) { r.state.updatedAt = Date.now(); state = r.state; lsSet(LOCAL_KEY, JSON.stringify(state)); }
    return r;
  }
  function withState(edit) { return mutate((s) => { if (!s) return { write: false }; edit(s); return { write: true, state: s }; }); }
  async function runDraws() {
    if (!state || busy) return;
    const probe = clone(state); const pr = processDrawsOf(probe, new Date());
    if (!pr.changed) return;
    busy = true;
    try {
      const r = await mutate((s) => { if (!s) return { write: false, added: [] }; const x = processDrawsOf(s, new Date()); return { write: x.changed, state: s, added: x.added }; });
      if (store.mode !== 'fb') afterStateChange();
      const today = dateStr(new Date());
      const todays = (r.added || []).filter((k) => k.startsWith(today + '_'));
      if (todays.length && !(state && state.quiet) && !(reveal && reveal.current)) { reveal = { queue: todays, current: null, phase: null }; stepReveal(); }
      else if ((r.added || []).length && !todays.length) toast('지난 추첨 ' + r.added.length + '건을 정리했어요');

  }

  }

  function nextCapsule() {

  // ---------- events ----------
  function bind() {

    app.onclick = async (e) => {
      const t = e.target.closest('[data-go],[data-role],[data-onb-next],[data-onb-start],[data-onb-add],[data-onb-remove],[data-onb-period],[data-onb-icon],[data-fit],[data-fit-random],[data-fit-toggle],[data-done],[data-cheer],[data-add-chore],[data-edit-chore],[data-cancel-chore],[data-save-chore],[data-delete-chore],[data-form-icon],[data-step],[data-coin],[data-wallet-even],[data-wallet-save],[data-switch-role],[data-reset],[data-room-create],[data-room-pick-join],[data-room-pick],[data-room-join],[data-copy-invite],[data-leave-room],[data-retry]');
      if (!t) return;
      const ds = t.dataset;
      try {
        if (ds.go !== undefined) { e.preventDefault(); go(ds.go); return; }
        if (ds.role) { setRole(ds.role); return; }
        // room
        if (ds.roomCreate !== undefined) { connectRoom(makeCode()); return; }
        if (ds.roomPickJoin !== undefined) { roomScreen = 'join'; render(); setTimeout(() => { const i = $('#room-code'); i && i.focus(); }, 0); return; }
        if (ds.roomPick !== undefined) { roomScreen = 'pick'; render(); return; }
        if (ds.roomJoin !== undefined) { const v = ($('#room-code').value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); if (v.length !== 8) { toast('방 코드는 8자예요'); return; } connectRoom(v); return; }
        if (ds.copyInvite !== undefined) { const link = location.origin + location.pathname + '?room=' + store.code; try { await navigator.clipboard.writeText(link); toast('초대 링크를 복사했어요. 카톡으로 보내 주세요'); } catch (err) { prompt('이 링크를 복사해서 보내 주세요', link); } return; }
        if (ds.leaveRoom !== undefined) { leaveRoom(); return; }
        if (ds.retry !== undefined) { if (store.code) connectRoom(store.code); return; }
        // onboarding
        if (ds.onbNext) { readOnbInputs(); onb.step = Number(ds.onbNext); if (onb.step === 2 && !(onb.draft.players[0].name.trim() && onb.draft.players[1].name.trim())) { onb.step = 1; toast('두 사람 이름을 적어 주세요'); } render(); return; }
        // outfit
        if (ds.fit) { const [ctx, field, value] = ds.fit.split(':'); await applyFit(ctx, (pl) => { pl[field] = value; }); return; }
        if (ds.fitRandom) { await applyFit(ds.fitRandom, (pl, who) => { randomOutfit(pl, who); }); return; }
        if (ds.fitToggle) { fitOpen = fitOpen === ds.fitToggle ? null : ds.fitToggle; const names = readSettingsInputs(); if (Object.keys(names).length) { await withState((s) => { applyNames(s, names); }); if (store.mode !== 'fb') afterStateChange(); } render(); return; }
        if (ds.onbAdd !== undefined) { readOnbInputs(); if (onb.draft.chores.length >= 12) { toast('캡슐은 12개까지만'); return; } onb.draft.chores.push({ name: '', icon: 'broom', period: 3 }); render(); setTimeout(() => { const ins = document.querySelectorAll('[data-onb-chore-name]'); ins[ins.length - 1] && ins[ins.length - 1].focus(); }, 0); return; }
        if (ds.onbRemove) { readOnbInputs(); onb.draft.chores.splice(Number(ds.onbRemove), 1); render(); return; }
        if (ds.onbPeriod) { const [i, dlt] = ds.onbPeriod.split(':'); readOnbInputs(); const c = onb.draft.chores[Number(i)]; c.period = clamp(c.period + Number(dlt), 1, 30); render(); return; }
        if (ds.onbIcon) { readOnbInputs(); const keys = Object.keys(ICONS); const c = onb.draft.chores[Number(ds.onbIcon)]; c.icon = keys[(keys.indexOf(c.icon) + 1) % keys.length]; render(); return; }
        if (ds.onbStart !== undefined) { readOnbInputs(); await startRoom(); return; }
        // today
        if (ds.done) { const k = ds.done; let pts = 0, who = null; await withState((s) => { const r = s.draws && s.draws[k]; if (r && !r.done) { r.done = true; r.doneAt = Date.now(); pts = r.points; who = r.who; } }); if (who) { doneFlash[who] = Date.now() + 3200; if (store.mode !== 'fb') afterStateChange(); setTimeout(render, 3300); toast('캡슐 처리 완료! +' + pts + '점은 이미 들어가 있어요'); } return; }
        if (ds.cheer) { const k = ds.cheer; await withState((s) => { const r = s.draws && s.draws[k]; if (r) r.cheers = (r.cheers || 0) + 1; }); if (store.mode !== 'fb') afterStateChange(); hearts(); return; }
        // board
        if (ds.addChore !== undefined) { addingChore = true; editingChore = null; render(); return; }
        if (ds.editChore) { editingChore = ds.editChore; addingChore = false; render(); return; }
        if (ds.cancelChore !== undefined) { addingChore = false; editingChore = null; render(); return; }
        if (ds.formIcon) { $('#cf-icon').value = ds.formIcon; document.querySelectorAll('[data-form-icon]').forEach((b) => b.classList.toggle('on', b.dataset.formIcon === ds.formIcon)); return; }
        if (ds.step) { const [id, dlt] = ds.step.split(':'); const inp = document.getElementById(id); inp.value = clamp((Number(inp.value) || 1) + Number(dlt), 1, 30); return; }
        if (ds.saveChore !== undefined) { await saveChoreForm(); return; }
        if (ds.deleteChore) { const id = ds.deleteChore; await withState((s) => { s.chores = s.chores.filter((c) => c.id !== id); for (const p of ['A', 'B']) if (s.prefs && s.prefs[p]) delete s.prefs[p][id]; }); editingChore = null; walletDraft = null; if (store.mode !== 'fb') afterStateChange(); toast('캡슐을 뺐어요. 동전 지갑을 다시 채워 주세요'); return; }
        // wallet
        if (ds.coin) { const [id, dlt] = ds.coin.split(':'); walletDraft[id] = clamp((walletDraft[id] || 5) + Number(dlt), 1, 10); render(); return; }
        if (ds.walletEven !== undefined) { for (const c of chores()) walletDraft[c.id] = 5; render(); return; }
        if (ds.walletSave !== undefined) { const draft = { ...walletDraft }; const who = me; await withState((s) => { s.prefs = s.prefs || {}; s.prefs[who] = draft; }); if (store.mode !== 'fb') afterStateChange(); toast('지갑을 채웠어요. 다음 추첨부터 적용돼요'); return; }
        // settings
        if (ds.switchRole !== undefined) { if (!switchArmed) { switchArmed = true; render(); setTimeout(() => { switchArmed = false; if (route === 'settings') render(); }, 4000); return; } switchArmed = false; walletDraft = null; setRole(other(me)); toast('이제 이 폰은 ' + playerName(me) + ' 폰이에요'); return; }
        if (ds.reset !== undefined) { if (!resetArmed) { resetArmed = true; render(); setTimeout(() => { resetArmed = false; if (route === 'settings') render(); }, 4000); return; } resetArmed = false; await wipe(); return; }
      } catch (err) { console.error(err); toast('잠깐 문제가 생겼어요. 다시 눌러 주세요'); }
    };
    app.onchange = async (e) => {
      const t = e.target; const ds = t.dataset;
      try {
        if (ds.onbTime !== undefined) { onb.draft.drawTime = t.value || '08:00'; return; }
        if (ds.setTime !== undefined) { const v = t.value || '08:00'; await withState((s) => { s.drawTime = v; }); if (store.mode !== 'fb') afterStateChange(); return; }
        if (ds.setQuiet !== undefined) { const v = t.checked; await withState((s) => { s.quiet = v; }); return; }
        if (ds.setName !== undefined) { const v = t.value.trim(); const k = ds.setName; if (v) { await withState((s) => { s.players[k].name = v; }); if (store.mode !== 'fb') afterStateChange(); } return; }
        if (ds.onbName !== undefined) readOnbInputs();
      } catch (err) { console.error(err); toast('저장이 잠깐 안 됐어요'); }
    };
  }
  async function applyFit(ctx, edit) {
    if (ctx[0] === 'o') { readOnbInputs(); const i = Number(ctx[1]); const who = i === 0 ? 'A' : 'B'; onb.draft.players[i] = normalizePlayer(who, onb.draft.players[i]); edit(onb.draft.players[i], who); render(); return; }
    const names = readSettingsInputs();
    await withState((s) => { applyNames(s, names); s.players[ctx] = normalizePlayer(ctx, s.players[ctx]); edit(s.players[ctx], ctx); });
    if (store.mode !== 'fb') afterStateChange();
  }
  function readOnbInputs() {
    document.querySelectorAll('[data-onb-name]').forEach((i) => { onb.draft.players[Number(i.dataset.onbName)].name = i.value; });
    document.querySelectorAll('[data-onb-chore-name]').forEach((i) => { onb.draft.chores[Number(i.dataset.onbChoreName)].name = i.value; });

  }

  function applyNames(s, names) { for (const k in names) if (s.players[k]) s.players[k].name = names[k]; }
  async function startRoom() {
    const d = onb.draft; const today = dateStr(new Date());
    const cs = d.chores.filter((c) => c.name.trim()).map((c) => ({ id: uid(), name: c.name.trim(), icon: c.icon, period: clamp(c.period, 1, 30), startDate: today, createdDate: today }));
    if (!cs.length) { toast('캡슐을 하나 이상 넣어 주세요'); return; }
    const pA = { ...d.players[0], name: d.players[0].name.trim() }, pB = { ...d.players[1], name: d.players[1].name.trim() };
    const fresh = { v: 2, seed: uid() + uid(), createdAt: Date.now(), players: { A: pA, B: pB }, drawTime: d.drawTime || '08:00', chores: cs, prefs: { A: {}, B: {} }, draws: {}, lastProcessed: null, quiet: false };

  async function saveChoreForm() {

    const id = $('#chore-form').dataset.choreId; const today = dateStr(new Date());

    await withState((s) => {
      if (id) { const c = s.chores.find((x) => x.id === id); if (c) { const periodChanged = c.period !== period || c.startDate !== start; c.name = name; c.icon = ic; c.period = period; c.startDate = start; if (periodChanged) c.createdDate = (c.createdDate && c.createdDate > today) ? c.createdDate : today; } }
      else s.chores.push({ id: uid(), name, icon: ic, period, startDate: start, createdDate: today });
    });

    if (store.mode !== 'fb') afterStateChange();

    runDraws();
  }
  function hearts() { const hero = $('#hero'); if (!hero) return; for (let i = 0; i < 5; i++) { const h = document.createElement('span'); h.className = 'heart'; h.textContent = '♥'; h.style.color = 'var(--red)'; h.style.left = (30 + Math.random() * 40) + '%'; h.style.top = '40%'; h.style.animationDelay = (i * 0.12) + 's'; hero.appendChild(h); setTimeout(() => h.remove(), 1800); } }
  function go(r) { route = r; if (route !== 'wallet') walletDraft = null; addingChore = false; editingChore = null; resetArmed = false; switchArmed = false; fitOpen = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); if (reveal && !reveal.current) stepReveal(); }
  setInterval(() => { if (state && me) runDraws(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state && me) runDraws(); });

  init();
})();
</script>
</body>
