<style>
/* Layout: one phone-width column; sticker-style cards with ink outlines and hard offset shadows; the capsule machine is the hero. */
:root {

    --dot: rgba(246,238,226,0.07);

* { box-sizing: border-box; }
html, body { height: 100%; }
body {

.pbar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; border: 1.5px solid var(--line); background: var(--paper-2); }
.pbar .pa { background: var(--a); } .pbar .pb { background: var(--b); }
.pbar .adj-a { background: repeating-linear-gradient(135deg, var(--a) 0 4px, var(--paper) 4px 7px); }
.pbar .adj-b { background: repeating-linear-gradient(135deg, var(--b) 0 4px, var(--paper) 4px 7px); }

.hero { display: grid; grid-template-columns: minmax(0, 1fr) 186px minmax(0, 1fr); align-items: end; gap: 4px; min-height: 330px; }
@media (max-width: 420px) { .hero { grid-template-columns: minmax(0, 1fr) 140px minmax(0, 1fr); } }
.player { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.bubble { position: relative; background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 6px 8px; font-size: 11px; line-height: 1.3; text-align: center; box-shadow: 0 3px 0 var(--line); max-width: 100%; word-break: keep-all; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; margin-left: -5px; background: var(--paper); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 14px; border: 2px solid var(--line); text-align: center; line-height: 1.25; max-width: 100%; word-break: keep-all; }
.badge.a { background: var(--a); color: var(--a-ink); } .badge.b { background: var(--b); color: var(--b-ink); }
.char { width: 100%; max-width: 104px; height: auto; display: block; overflow: visible; }
.char .body { transform-box: fill-box; transform-origin: 50% 90%; }
.char.sleepy .body { transform: rotate(6deg) translateY(2px); }
.char.pout .body { transform: rotate(-3deg); }
.char.proud .body { animation: hop 1.6s ease-in-out infinite; }
.char.done .body { animation: jump .6s ease-out; }
.char.calm .body { animation: breathe 3s ease-in-out infinite; }
.zz { animation: floatz 2.5s ease-in-out infinite; }
.spark { animation: twinkle 1.4s ease-in-out infinite; } .spark.s2 { animation-delay: .7s; }
@keyframes hop { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
@keyframes jump { 0% { transform: translateY(0) } 40% { transform: translateY(-8px) } 100% { transform: translateY(0) } }
@keyframes breathe { 0%,100% { transform: scaleY(1) } 50% { transform: scaleY(1.015) } }
@keyframes floatz { 0% { opacity: 0; transform: translateY(4px) } 30% { opacity: 1 } 100% { opacity: 0; transform: translateY(-10px) } }
@keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.8) } 50% { opacity: 1; transform: scale(1.1) } }

.machine-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.machine { width: 100%; height: auto; display: block; overflow: visible; }
.machine .dome, .machine .marbles { transform-box: fill-box; transform-origin: 50% 100%; }
.machine.shaking .dome { animation: shake 1.2s ease-in-out; }
.machine.shaking .marbles { animation: jiggle 1.2s ease-in-out; }
.machine.shaking .handle { animation: spin 1.2s ease-in-out; transform-box: fill-box; transform-origin: 50% 50%; }
.machine .drop { opacity: 0; }
.machine.dropping .drop { animation: drop .5s ease-in forwards; }
@keyframes shake { 0%,100% { transform: rotate(0) } 15% { transform: rotate(-4deg) } 30% { transform: rotate(4deg) } 45% { transform: rotate(-3deg) } 60% { transform: rotate(3deg) } 75% { transform: rotate(-2deg) } 90% { transform: rotate(1deg) } }
@keyframes jiggle { 0%,100% { transform: translateY(0) } 20% { transform: translateY(-6px) } 40% { transform: translateY(2px) } 60% { transform: translateY(-5px) } 80% { transform: translateY(1px) } }
@keyframes spin { from { transform: rotate(0) } to { transform: rotate(360deg) } }
@keyframes drop { 0% { opacity: 1; transform: translateY(-40px) } 70% { opacity: 1; transform: translateY(0) } 85% { transform: translateY(-5px) } 100% { opacity: 1; transform: translateY(0) } }
.machine-label { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

.result-banner { border: 2px solid var(--line); border-radius: 20px; background: var(--paper); box-shadow: 0 4px 0 var(--line); padding: 14px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; animation: pop .35s ease-out; }
.result-banner .big { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; word-break: keep-all; }
.result-banner .shout { font-size: 13px; color: var(--muted); letter-spacing: 2px; }
@keyframes pop { 0% { transform: scale(.92); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
.rattle { animation: rattle .4s linear infinite; display: inline-block; }
@keyframes rattle { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-2px) } 75% { transform: translateX(2px) } }

.capsule-card { display: flex; align-items: center; gap: 10px; }
.capsule-card .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.capsule-card .title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; word-break: keep-all; }
.capsule-card .reason { font-size: 11px; color: var(--muted); line-height: 1.3; word-break: keep-all; }
.capsule-card.done { opacity: .62; }
.capsule-card.done .title > span:first-child { text-decoration: line-through; text-decoration-thickness: 2px; }
.cap-icon { flex-shrink: 0; width: 44px; height: 44px; }

.track { display: flex; align-items: flex-end; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.track::-webkit-scrollbar { display: none; }
.slot { flex-shrink: 0; width: 56px; height: 56px; border-radius: 12px; border: 1.5px dashed var(--line); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font-size: 10px; color: var(--muted); }
.slot.inlet { width: 44px; border: 0; background: var(--line); color: var(--bg); font-weight: 700; line-height: 1.2; text-align: center; align-items: center; }
.slot.cap { width: 88px; height: auto; min-height: 78px; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; padding: 6px 4px; color: var(--ink); }
.slot.cap.next { background: var(--mint); color: var(--mint-ink); border-style: solid; }
.slot.cap .n { font-size: 10px; font-weight: 700; text-align: center; line-height: 1.2; max-width: 100%; overflow-wrap: anywhere; }
.slot.cap .n small { font-weight: 400; display: block; white-space: nowrap; }
.wobble { animation: wobble 1.6s ease-in-out infinite; }
@keyframes wobble { 0%,100% { transform: rotate(-6deg) } 50% { transform: rotate(6deg) } }

.score-row { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; }
.score-row .lbl { width: auto; max-width: 84px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tube { flex: 1; height: 14px; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--paper-2); }
.tube > div { height: 100%; transition: width .6s ease; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); background: var(--paper); border-top: 2px solid var(--line); }
.nav-inner { width: 100%; max-width: 480px; display: flex; justify-content: space-around; align-items: center; height: 64px; padding: 0 8px; }
.tab { height: 46px; padding: 0 12px; border-radius: 14px; border: 2px solid transparent; background: transparent; color: var(--muted); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.tab.on { background: var(--red); color: var(--red-ink); border-color: var(--line); }
.tab svg { width: 18px; height: 18px; flex-shrink: 0; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 700; color: var(--muted); }
.input { min-height: 44px; padding: 0 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); width: 100%; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.coinrow { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }

.coin.on { background: var(--gold); }

.hist-item:last-child { border-bottom: 0; }

.hist-item .r { font-size: 11px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 8px; word-break: keep-all; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; z-index: 20; animation: pop .25s ease-out; max-width: calc(100% - 32px); text-align: center; }

@keyframes heartup { 0% { opacity: 0; transform: translateY(0) scale(.6) } 20% { opacity: 1 } 100% { opacity: 0; transform: translateY(-70px) scale(1.2) } }
.onb-steps { display: flex; gap: 6px; }
.onb-steps span { flex: 1; height: 6px; border-radius: 999px; background: var(--track); }
.onb-steps span.on { background: var(--red); }
.hero-wrap { position: relative; }
.rule { font-size: 12px; line-height: 1.55; color: var(--muted); word-break: keep-all; }
.rule b { color: var(--ink); }
.code { font-size: 22px; font-weight: 700; letter-spacing: 3px; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

  // ---------- storage ----------
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
  function loadLocal() { try { const s = lsGet(LOCAL_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function roleKey() { return ROLE_KEY + (store.code || 'local'); }
  // Apply fn to the latest state atomically. fn(s) mutates s (s may be null) and returns {write, state, ...}.
  async function mutate(fn) {
    if (store.mode === 'fb') {
      return store.db.runTransaction(async (tx) => {
        const snap = await tx.get(store.ref);
        const s = snap.exists ? clone(snap.data()) : null;
        const r = fn(s);
        if (r && r.write) { r.state.updatedAt = Date.now(); tx.set(store.ref, r.state); }
        return r;
      });
    }
    const r = fn(state);
    if (r && r.write) { r.state.updatedAt = Date.now(); state = r.state; lsSet(LOCAL_KEY, JSON.stringify(state)); }
    return r;
  }
  function withState(edit) { return mutate((s) => { if (!s) return { write: false }; edit(s); return { write: true, state: s }; }); }
  async function runDraws() {
    if (!state || busy) return;
    const probe = clone(state); const pr = processDrawsOf(probe, new Date());
    if (!pr.changed) return;
    busy = true;
    try {
      const r = await mutate((s) => { if (!s) return { write: false, added: [] }; const x = processDrawsOf(s, new Date()); return { write: x.changed, state: s, added: x.added }; });
      if (store.mode !== 'fb') afterStateChange();
      const today = dateStr(new Date());
      const todays = (r.added || []).filter((k) => k.startsWith(today + '_'));
      if (todays.length && !(state && state.quiet) && !(reveal && reveal.current)) { reveal = { queue: todays, current: null, phase: null }; stepReveal(); }
      else if ((r.added || []).length && !todays.length) toast('지난 추첨 ' + r.added.length + '건을 정리했어요');
    } catch (e) { store.error = e; toast('저장소에 연결하지 못했어요'); }
    finally { busy = false; }
    render();
  }
  function afterStateChange() {
    resolveRole(); render();
  }
  function resolveRole() {
    if (!state) { me = null; return; }
    if (me === 'A' || me === 'B') return;                 // already chosen on this device (survives blocked storage)
    const r = lsGet(roleKey()); me = (r === 'A' || r === 'B') ? r : null;
  }
  function setRole(r) { me = r; lsSet(roleKey(), r); render(); if (reveal && !reveal.current) stepReveal(); }
  function canReveal() { return !!(state && me && route === 'today'); }
  function stepReveal() {
    if (!reveal) return;
    if (!canReveal()) { reveal.current = null; reveal.phase = null; return; }   // resumes when the today screen is visible
    if (!reveal.queue.length) { reveal = null; render(); return; }
    reveal.current = reveal.queue.shift(); reveal.phase = 'shake'; render();
    setTimeout(() => { if (!reveal || !reveal.current) return; reveal.phase = 'show'; render(); const r = state && state.draws && state.draws[reveal.current]; const lv = $('#live'); if (lv && r) lv.textContent = '오늘 ' + r.choreName + ' 담당은 ' + playerName(r.who) + ', ' + r.points + '점'; setTimeout(() => { if (!reveal) return; reveal.current = null; stepReveal(); }, 2600); }, 1300);
  }
  function connectRoom(code) {
    store.code = code; lsSet(ROOM_KEY, code);
    if (store.unsub) store.unsub();

    loading = true; render();
    store.unsub = store.ref.onSnapshot((snap) => {
      state = snap.exists ? clone(snap.data()) : null;
      if (reveal) { const d = (state && state.draws) || {}; reveal.queue = reveal.queue.filter((k) => d[k]); if (reveal.current && !d[reveal.current]) { reveal.current = null; if (!reveal.queue.length) reveal = null; } }

  }

  async function wipe() {
    if (store.mode === 'fb' && store.ref) { try { await store.ref.delete(); } catch (e) { } lsSet(roleKey(), null); state = null; me = null; onb = { step: 1, draft: null }; reveal = null; route = 'today'; render(); return; }
    lsSet(LOCAL_KEY, null); lsSet(roleKey(), null); state = null; me = null; onb = { step: 1, draft: null }; reveal = null; route = 'today'; render();
  }
  function init() {
    const params = new URLSearchParams(location.search);
    const roomParam = (params.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (roomParam) { lsSet(ROOM_KEY, roomParam); history.replaceState(null, '', location.pathname); }
    if (FIREBASE_CONFIG && window.firebase) {

        firebase.initializeApp(FIREBASE_CONFIG);

        const code = lsGet(ROOM_KEY);

      } catch (e) { store.mode = 'local'; store.error = e; }
    }
    if (store.mode === 'local') { state = loadLocal(); loading = false; resolveRole(); render(); if (state) runDraws(); }
  }

  // ---------- toast ----------

  // ---------- render ----------
  function render() {
    const app = $('#app');

    if (store.error && !state) { app.innerHTML = topbar(false) + '<main><section class="card"><h2>저장소에 연결하지 못했어요</h2><p class="rule" style="margin-top:6px">인터넷 연결과 Firebase 설정(규칙 게시 여부)을 확인해 주세요.<br><span style="font-size:11px">' + esc(String(store.error && store.error.message || store.error)) + '</span></p><div class="row" style="margin-top:10px"><button class="btn" data-retry>다시 시도</button><button class="btn" data-leave-room>다른 방 코드 쓰기</button></div></section></main>'; bind(); return; }
    if (!state) { app.innerHTML = topbar(false) + '<main>' + viewOnboarding() + '</main>'; bind(); return; }
    if (!me) { app.innerHTML = topbar(false) + '<main>' + viewRolePick() + '</main>'; bind(); return; }
    let body = '';
    switch (route) {
      case 'board': body = viewBoard(); break;
      case 'wallet': body = viewWallet(); break;
      case 'history': body = viewHistory(); break;
      case 'settings': body = viewSettings(); break;

    bind();
  }
  function nextCapsule() {
    const today = dateStr(new Date()); const ready = timeStr(new Date()) >= (state.drawTime || '08:00');
    const from = ready ? addDays(today, 1) : today; let best = null;
    for (const c of chores()) { const d = nextDue(c, from); if (d && (!best || d < best.date)) best = { date: d, chores: [c] }; else if (d && best && d === best.date) best.chores.push(c); }

  }
  function topbar(full) {

    let next = '';
    if (full && state) { const nc = nextCapsule(); next = nc ? ('다음 추첨 ' + relDay(nc.date, dateStr(now)) + ' ' + fmtTime(state.drawTime || '08:00') + ' · ' + esc(nc.chores[0].name) + (nc.chores.length > 1 ? ' 외 ' + (nc.chores.length - 1) + '개' : '')) : '말판이 비었어요'; }

      (full ? '<div class="next"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/></svg><span>' + next + '</span></div><button class="iconbtn" data-go="settings" aria-label="설정"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>' : '<div class="next"><span>' + fmtDate(dateStr(now), true) + '</span></div>') +

  }
  function nav() {
    const t = (id, label, svg) => '<button class="tab' + (route === id ? ' on' : '') + '" data-go="' + id + '"' + (route === id ? ' aria-current="page"' : '') + '>' + svg + label + '</button>';

      t('today', '오늘', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4 12a8 8 0 0 1 16 0z"/><rect x="3" y="12" width="18" height="8" rx="3"/></svg>') +
      t('board', '말판', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="3" y="7" width="5" height="10" rx="1.5"/><rect x="9.5" y="7" width="5" height="10" rx="1.5"/><rect x="16" y="7" width="5" height="10" rx="1.5"/></svg>') +
      t('wallet', '동전 지갑', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>') +

  }

        if (ds.onbRemove) { readOnbInputs(); onb.draft.chores.splice(Number(ds.onbRemove), 1); render(); return; }
        if (ds.onbPeriod) { const [i, dlt] = ds.onbPeriod.split(':'); readOnbInputs(); const c = onb.draft.chores[Number(i)]; c.period = clamp(c.period + Number(dlt), 1, 30); render(); return; }
        if (ds.onbIcon) { readOnbInputs(); const keys = Object.keys(ICONS); const c = onb.draft.chores[Number(ds.onbIcon)]; c.icon = keys[(keys.indexOf(c.icon) + 1) % keys.length]; render(); return; }

        if (ds.reset !== undefined) { if (!resetArmed) { resetArmed = true; render(); setTimeout(() => { resetArmed = false; if (route === 'settings') render(); }, 4000); return; } resetArmed = false; await wipe(); return; }
      } catch (err) { console.error(err); toast('잠깐 문제가 생겼어요. 다시 눌러 주세요'); }

        if (ds.onbName !== undefined) readOnbInputs();
      } catch (err) { console.error(err); toast('저장이 잠깐 안 됐어요'); }
    };
  }

    document.querySelectorAll('[data-onb-chore-name]').forEach((i) => { onb.draft.chores[Number(i.dataset.onbChoreName)].name = i.value; });

  async function startRoom() {
    const d = onb.draft; const today = dateStr(new Date());

    if (!cs.length) { toast('캡슐을 하나 이상 넣어 주세요'); return; }
    const pA = { ...d.players[0], name: d.players[0].name.trim() }, pB = { ...d.players[1], name: d.players[1].name.trim() };
    const fresh = { v: 2, seed: uid() + uid(), createdAt: Date.now(), players: { A: pA, B: pB }, drawTime: d.drawTime || '08:00', chores: cs, prefs: { A: {}, B: {} }, draws: {}, lastProcessed: null, quiet: false };
    await mutate((s) => (s ? { write: false } : { write: true, state: fresh }));
    if (store.mode !== 'fb') { me = null; afterStateChange(); runDraws(); }
  }
  async function saveChoreForm() {

    const period = clamp(Number($('#cf-period').value) || 1, 1, 30); const start = $('#cf-start').value || dateStr(new Date()); const ic = $('#cf-icon').value;
    const id = $('#chore-form').dataset.choreId; const today = dateStr(new Date());

      if (id) { const c = s.chores.find((x) => x.id === id); if (c) { const periodChanged = c.period !== period || c.startDate !== start; c.name = name; c.icon = ic; c.period = period; c.startDate = start; if (periodChanged) c.createdDate = (c.createdDate && c.createdDate > today) ? c.createdDate : today; } }
      else s.chores.push({ id: uid(), name, icon: ic, period, startDate: start, createdDate: today });
    });

    if (store.mode !== 'fb') afterStateChange();

  }
  function hearts() { const hero = $('#hero'); if (!hero) return; for (let i = 0; i < 5; i++) { const h = document.createElement('span'); h.className = 'heart'; h.textContent = '♥'; h.style.color = 'var(--red)'; h.style.left = (30 + Math.random() * 40) + '%'; h.style.top = '40%'; h.style.animationDelay = (i * 0.12) + 's'; hero.appendChild(h); setTimeout(() => h.remove(), 1800); } }
  function go(r) { route = r; if (route !== 'wallet') walletDraft = null; addingChore = false; editingChore = null; resetArmed = false; switchArmed = false; fitOpen = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); if (reveal && !reveal.current) stepReveal(); }
  setInterval(() => { if (state && me) runDraws(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state && me) runDraws(); });

  init();
})();
</script>
